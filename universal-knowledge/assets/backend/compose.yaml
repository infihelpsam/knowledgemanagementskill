services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - knowledge-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U knowledge -d knowledge]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    command: [python, -m, knowledge.migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build: .
    env_file: .env
    command: [python, -m, knowledge.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  postgres-test:
    profiles: [test]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge_test
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U knowledge -d knowledge_test]
      interval: 5s
      timeout: 3s
      retries: 20
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://knowledge:isolated-test-only@postgres-test:5432/knowledge_test
    depends_on:
      postgres-test:
        condition: service_healthy
volumes:
  knowledge-db:
