[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-knowledge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "numpy>=1.26,<3", "pydantic-settings>=2.5,<3", "pypdf>=5,<7", "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "redis>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["knowledge*"]

[tool.setuptools.package-data]
knowledge = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to a disposable pgvector database"]
