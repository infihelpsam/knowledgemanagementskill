name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: knowledge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './universal-knowledge/assets/backend[test]'
      - run: python scripts/validate.py
      - run: pytest -q tests universal-knowledge/assets/backend/tests
        env:
          TEST_DATABASE_URL: postgresql://knowledge:ci-disposable-only@localhost:5432/knowledge_test
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/
